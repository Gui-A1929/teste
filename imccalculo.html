<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .calculator {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 300px;
            width: 100%;
        }
        .calculator input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .calculator button {
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .calculator button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 15px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Calculadora de IMC</h2>
    <label for="weight">Peso (kg):</label>
    <input type="number" id="weight" placeholder="Ex: 70" required>

    <label for="height">Altura (m):</label>
    <input type="number" id="height" step="0.01" placeholder="Ex: 1.75" required>

    <button onclick="calculateIMC()">Calcular IMC</button>
    <div class="result" id="result"></div>
</div>

<script>
    function calculateIMC() {
        const weight = parseFloat(document.getElementById("weight").value);
        const height = parseFloat(document.getElementById("height").value);

        if (weight && height) {
            const imc = weight / (height * height);
            const resultText = `Seu IMC é: ${imc.toFixed(2)} - `;

            let classification;
            if (imc < 18.5) classification = "Abaixo do peso";
            else if (imc < 24.9) classification = "Peso normal";
            else if (imc < 29.9) classification = "Sobrepeso";
            else if (imc < 34.9) classification = "Obesidade grau I";
            else if (imc < 39.9) classification = "Obesidade grau II";
            else classification = "Obesidade grau III";

            document.getElementById("result").innerText = resultText + classification;
        } else {
            document.getElementById("result").innerText = "Por favor, insira peso e altura válidos.";
        }
    }
</script>

</body>
</html>
